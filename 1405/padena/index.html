<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple audio player</title>
  <!-- minimal styling to keep it clean -->
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #f8faff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .player-card {
      background: white;
      max-width: 480px;
      width: 100%;
      padding: 2rem 1.5rem 2.2rem;
      border-radius: 2rem;
      box-shadow: 0 12px 30px rgba(0, 20, 30, 0.12);
      text-align: center;
      transition: box-shadow 0.2s;
      border: 1px solid rgba(200, 212, 230, 0.3);
    }
    .player-card:hover {
      box-shadow: 0 18px 40px rgba(18, 52, 77, 0.10);
    }
    h2 {
      font-weight: 450;
      font-size: 1.7rem;
      letter-spacing: -0.01em;
      margin-top: 0.2rem;
      margin-bottom: 0.5rem;
      color: #0b1e2e;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .sub {
      color: #2c4a66;
      font-size: 0.95rem;
      margin-top: -0.2rem;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid #e2ecf5;
      padding-bottom: 1rem;
      display: inline-block;
    }
    /* audio player styling – clean & native */
    audio {
      width: 100%;
      margin: 0.8rem 0 1rem;
      border-radius: 60px;
      background: #f0f5fe;
      padding: 0.2rem 0.2rem;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
    }
    /* fallback / info */
    .info-note {
      font-size: 0.9rem;
      color: #2e4b68;
      background: #eef5fc;
      padding: 0.7rem 1rem;
      border-radius: 60px;
      display: inline-block;
      margin-top: 0.6rem;
      border: 1px solid #d4e2f0;
      backdrop-filter: blur(2px);
    }
    .info-note code {
      background: #d5e2f2;
      padding: 0.1rem 0.7rem;
      border-radius: 30px;
      font-size: 0.85rem;
      color: #002b4a;
    }
    .footer {
      margin-top: 1.8rem;
      font-size: 0.8rem;
      color: #5b6f82;
      border-top: 1px dashed #cbdae7;
      padding-top: 1.2rem;
    }
    /* tiny accessibility */
    @media (max-width: 400px) {
      .player-card { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="player-card">
    <h2>
      <img src=img1.jpeg/>
      <span>🎵</span> Audio<span style="font-weight:300;">Player</span>
    </h2>
    <div class="sub">simple · native · ready</div>

    <!-- ===== AUDIO PLAYER TAG ===== -->
    <audio controls preload="metadata">
      <!-- 
        replace the src with your own audio file.
        the sample is a short instrumental from the public domain.
      -->
      <source src="test.mp3" type="audio/mpeg">
      <!-- fallback for unsupported browsers -->
      Your browser does not support the audio element.
    </audio>

    <div class="info-note">
      ⏵ <code>controls</code> · <code>preload</code>
    </div>
    <div class="footer">
      <span>⏹️ replace <strong>src</strong> with your own file</span>
    </div>
  </div>
</body>
</html>
